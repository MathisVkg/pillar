name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app:
          - name: main
            dockerfile: Dockerfile
          # Add new apps here when ready:
          # - name: camera
          #   dockerfile: apps/camera/Dockerfile
          # - name: books
          #   dockerfile: apps/books/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          tags: |
            ghcr.io/mathisvkg/pillar-${{ matrix.app.name }}:latest
            ghcr.io/mathisvkg/pillar-${{ matrix.app.name }}:${{ github.sha }}