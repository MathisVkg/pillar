name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app:
          - name: main
            app_dir: main
          - name: finpilot
            app_dir: finpilot

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: APP=${{ matrix.app.app_dir }}
          push: true
          tags: |
            ghcr.io/mathisvkg/pillar-${{ matrix.app.name }}:latest
            ghcr.io/mathisvkg/pillar-${{ matrix.app.name }}:${{ github.sha }}
